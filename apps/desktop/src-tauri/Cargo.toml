[package]
name = "sentinel-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Iklwa Sentinel desktop application."
build = "build.rs"

[lib]
# Tauri's mobile targets require a cdylib; the desktop binary links the rlib.
name = "sentinel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sentinel-api.workspace = true
sentinel-common.workspace = true
sentinel-core.workspace = true
sentinel-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true

[features]
# Enabled by `tauri build` and by any release build. Without it the window loads `devUrl`
# from tauri.conf.json instead of the assets embedded in the binary, so a release build
# started outside `tauri dev` shows a blank window with no error. The debug default is the
# opposite: with no dev server running there is nothing to show either.
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies.tauri]
version = "2"
features = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
missing_docs = "warn"
