name: CI

# Sentinel's pipeline is the product. CI builds, lints and tests it on every push, on the
# platforms Sentinel claims to support.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run is not useful, and these builds are expensive enough to matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Shared target directory: the registry and dependency builds are reused across jobs, which is
  # most of the wall-clock time in a cold Rust build.
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Linting the workspace means linting sentinel-desktop, which means linking the Tauri
      # webview and resolving the frontend bundle. Skipping this step produced a clippy run
      # that died in a build script before it reached a single line of Sentinel code.
      - uses: ./.github/actions/setup-build-deps

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - uses: ./.github/actions/setup-build-deps

      # A Windows test binary links wpcap.dll statically, so Windows resolves it during process
      # startup and the binary cannot start without it -- even though not one of the 292 tests
      # calls a pcap function. They all run through generated frames and the offline reader.
      #
      # Real Npcap cannot be installed unattended on a runner; Npcap's own tracker says the
      # installer has no silent mode (nmap/npcap#227) and the silent installer is an OEM
      # feature. Given /S, the free installer completes its work and leaves a resident
      # process, which hung this job for 35 minutes before this step existed.
      #
      # The stub stands in for a machine with no capture driver. It answers interface
      # enumeration the way libpcap does when Npcap is absent -- an error, which Sentinel
      # surfaces as a typed user-facing failure -- and traps on every other call, so a test that
      # tried to capture for real would fail loudly rather than report a fabricated result.
      #
      # Its export table is read from the import tables of the binaries below, so the order
      # matters: --no-run compiles the test harnesses without executing them, which is exactly
      # what is needed here and is reused by the test step afterwards.
      - name: Build
        # `--locked` plus the explicit feature list: `custom-protocol` is what makes the
        # desktop binary load its embedded assets instead of the dev-server URL, and a build
        # without it produces a window that silently shows nothing.
        run: |
          cargo build --workspace --locked
          cargo build --release -p sentinel-desktop --features custom-protocol --locked
          cargo test --workspace --locked --no-run

      - name: Build the stub wpcap.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stub = Join-Path $env:RUNNER_TEMP 'iklwa-stub-wpcap'
          pwsh -File tools/build-stub-wpcap-dll.ps1 -OutputDirectory $stub
          "IKLWA_STUB_WPCAP=$stub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The suite does not need a capture driver or privileges: every packet-path test runs
      # through generated frames and the offline source. That is deliberate, and it means CI
      # is deterministic.
      #
      # Split rather than one step with a conditional PATH expression, because setting PATH to
      # an empty string on Linux would strip the toolchain out from under cargo. The Windows
      # PATH keeps System32 and the Windows directory: an MSVC test binary needs them to find
      # the CRT, and dropping them would fail on an unrelated DLL that looks like the stub's
      # fault.
      - name: Test (Windows, stubbed capture driver)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked
        env:
          PATH: ${{ env.IKLWA_STUB_WPCAP }}\;C:\Windows\system32\;C:\Windows\

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Typecheck
        working-directory: apps/desktop/frontend
        run: npm run typecheck

      - name: Lint
        working-directory: apps/desktop/frontend
        run: npm run lint

      - name: Check formatting
        working-directory: apps/desktop/frontend
        run: npm run format:check

      - name: Build
        working-directory: apps/desktop/frontend
        run: npm run build

  fixtures:
    name: Golden fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Fixtures are generated from source rather than committed as binaries, so their contents
      # are reviewable. That only helps if regenerating one produces the same bytes; a
      # difference would mean the generator drifted and a golden test could silently change
      # what it asserts.
      #
      # Only the libpcap headers are needed. The full setup action would install the webview
      # toolchain for sentinel-desktop, which this job never builds.
      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Regenerate and verify
        run: |
          cargo run -p sentinel-fixtures -- fixtures/demo-traffic.pcap
          git diff --exit-code -- fixtures/demo-traffic.pcap

  site:
    name: Download page is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # site/index.html is the file a web host serves. If it is committed but stale, whoever
      # deploys it publishes a download page that disagrees with the manifest it was generated
      # from -- which is the same failure the golden-fixture job above exists to prevent, for
      # the same reason. --check exits non-zero rather than rewriting the file.
      #
      # The generator cross-checks the manifest against Cargo.toml and tauri.conf.json, so this
      # job also fails if the version was bumped in code without updating the manifest.
      - name: Verify the download page matches its manifest
        run: python tools/generate-download-site.py --check