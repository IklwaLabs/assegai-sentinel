name: CI

# Sentinel's pipeline is the product. CI builds, lints and tests it on every push, on the
# platforms Sentinel claims to support.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run is not useful, and these builds are expensive enough to matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Shared target directory: the registry and dependency builds are reused across jobs, which is
  # most of the wall-clock time in a cold Rust build.
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpcap-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Npcap installer is interactive, so it is run silently. The SDK is what
          # provides wpcap.lib; without it a Windows job cannot link, which is exactly the
          # gap documented in DEVELOPMENT.md.
          $sdk = "$env:RUNNER_TEMP\npcap-sdk"
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.83.zip -OutFile "$env:RUNNER_TEMP\npcap-sdk.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\npcap-sdk.zip" -DestinationPath $sdk
          "IKLWA_PCAP_LIB=$sdk\Lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        # `--locked` plus the explicit feature list: `custom-protocol` is what makes the
        # desktop binary load its embedded assets instead of the dev-server URL, and a build
        # without it produces a window that silently shows nothing.
        run: |
          cargo build --workspace --locked
          cargo build --release -p sentinel-desktop --features custom-protocol --locked

      # The suite does not need a capture driver or privileges: every packet-path test runs
      # through generated frames and the offline source. That is deliberate, and it means CI
      # is deterministic.
      - name: Test
        run: cargo test --workspace --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop/frontend
        run: npm ci

      - name: Typecheck
        working-directory: apps/desktop/frontend
        run: npm run typecheck

      - name: Lint
        working-directory: apps/desktop/frontend
        run: npm run lint

      - name: Check formatting
        working-directory: apps/desktop/frontend
        run: npm run format:check

      - name: Build
        working-directory: apps/desktop/frontend
        run: npm run build

  fixtures:
    name: Golden fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # Fixtures are generated from source rather than committed as binaries, so their contents
      # are reviewable. That only helps if regenerating one produces the same bytes; a
      # difference would mean the generator drifted and a golden test could silently change
      # what it asserts.
      - name: Regenerate and verify
        run: |
          cargo run -p sentinel-fixtures -- fixtures/demo-traffic.pcap
          git diff --exit-code -- fixtures/demo-traffic.pcap
