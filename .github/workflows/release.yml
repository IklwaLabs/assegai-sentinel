name: Release

# Builds every platform Sentinel supports and attaches the artifacts to the release.
#
# Cross-compiling is not attempted from one machine. Rust's targets are cheap to add, but a
# Tauri bundle needs the *host* platform's webview, code-signing and packaging tools, and macOS
# in particular cannot be built from Windows or Linux at all. So each platform is built on its
# own runner, which is also the only honest way to test that a build works there.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish a release for"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never

jobs:
  # A release is only cut once every platform has passed its own tests. Building first and
  # discovering afterwards that Linux was already broken wastes the whole matrix.
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify-${{ matrix.os }}

      - uses: ./.github/actions/setup-build-deps

      # A Windows test binary links wpcap.dll statically, so Windows resolves it at process
      # start and the binary will not start without it -- even though no test calls pcap.
      #
      # Real Npcap cannot be installed unattended on a runner: Npcap's own tracker says the
      # installer has no silent mode (nmap/npcap#227), the silent installer is an OEM
      # feature, and the free one given /S leaves a resident process that hung this job for 35
      # minutes. So the stub stands in for a machine with no capture driver, which Sentinel
      # supports and reports as a typed error.
      #
      # PATH is *prepended* from inside the script, for this one step only. Doing it in the `env:`
      # block does not work: `${{ env.PATH }}` expands to nothing, because the runner's ambient
      # PATH is not part of the Actions `env` context, so cargo stops being found and the step
      # reports "The term 'cargo' is not recognized" -- which points nowhere near the cause.
      # The jobs below that produce artifacts never add the stub at all: a bundled binary must
      # resolve the real driver or fail at startup, never silently trap on the first capture.
      #
      # The compile comes first because the stub's export table is read from the import tables
      # of the test binaries it produces.
      - name: Compile the test binaries
        run: cargo test --workspace --locked --no-run

      - name: Build the stub wpcap.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stub = Join-Path $env:RUNNER_TEMP 'iklwa-stub-wpcap'
          pwsh -File tools/build-stub-wpcap-dll.ps1 -OutputDirectory $stub
          "IKLWA_STUB_WPCAP=$stub" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test (Windows, stubbed capture driver)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:IKLWA_STUB_WPCAP;$env:PATH"
          cargo test --workspace --locked

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - uses: ./.github/actions/setup-build-deps

      - name: Build the CLI for x86_64
        run: cargo build --release -p sentinel-cli --locked
        env:
          IKLWA_HOME: .sentinel-ci

      - name: Bundle deb and AppImage
        run: |
          npx --prefix apps/desktop/frontend tauri build \
            --config apps/desktop/src-tauri/tauri.conf.json \
            --bundles deb,appimage
        env:
          IKLWA_HOME: .sentinel-ci

      # Renamed to the names site/release-manifest.json advertises. Tauri emits its own names,
      # which embed the bundle target and locale, and publishing those would mean a download
      # URL that changes whenever Tauri is upgraded.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect artifacts
        run: |
          python tools/collect-artifacts.py --platform linux --staging artifacts
          # A tarball keeps the AppImage executable bit, which an artifact upload does not
          # reliably preserve for a raw file.
          tar czf artifacts/Sentinel-0.1.0-linux-x86_64.AppImage.tar.gz \
              -C artifacts Sentinel-0.1.0-linux-x86_64.AppImage
          ( cd artifacts && sha256sum * > SHA256SUMS.txt )
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-x86_64
          path: artifacts/

  macos:
    name: Build macOS
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - uses: ./.github/actions/setup-build-deps

      - name: Build the CLI
        run: cargo build --release -p sentinel-cli --locked
        env:
          IKLWA_HOME: .sentinel-ci

      - name: Bundle app and dmg
        run: |
          npx --prefix apps/desktop/frontend tauri build \
            --config apps/desktop/src-tauri/tauri.conf.json \
            --bundles app,dmg
        env:
          IKLWA_HOME: .sentinel-ci

      # Unsigned macOS builds are quarantined by Gatekeeper on open, so the checksum is
      # published alongside the file: a user who verifies it can clear the quarantine flag
      # themselves.
      # Renamed to the names site/release-manifest.json advertises; see the Linux job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package artifacts
        run: |
          python tools/collect-artifacts.py --platform macos --staging artifacts
          ( cd artifacts && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-macos
          path: artifacts/

  windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - uses: ./.github/actions/setup-build-deps

      - name: Build the CLI
        run: cargo build --release -p sentinel-cli --locked

      - name: Bundle NSIS and MSI
        run: |
          npx --prefix apps/desktop/frontend tauri build `
            --config apps/desktop/src-tauri/tauri.conf.json `
            --bundles nsis,msi

      # Renamed to the names site/release-manifest.json advertises; see the Linux job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The collect step is not wrapped in `|| true`. An artifact declared on the download page
      # that this job fails to produce has to stop the release, not ship a page with a dead link
      # on it.
      - name: Collect artifacts
        shell: pwsh
        run: |
          python tools/collect-artifacts.py --platform windows --staging artifacts
          Get-ChildItem artifacts | Format-Table Name, Length

      # The verify job builds a stub wpcap.dll so its test binaries can start on a machine
      # with no capture driver. This job must never resolve it. If PATH were set at job level
      # instead of step level, the binary in the installer would silently link against a DLL
      # whose every export aborts -- shipping an app that installs cleanly and dies on the first
      # capture. That is invisible here and obvious to a user, so it is checked.
      - name: Refuse to ship the CI stub capture driver
        shell: pwsh
        run: python tools/check-for-stub-dll.py artifacts target/release/sentinel.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-x86_64
          path: artifacts/

  # Android is built as an APK rather than an app bundle: an AAB is what Play Store wants, but
  # it can only be uploaded through Play Console and cannot be side-loaded for verification,
  # which makes it useless as a CI artifact.
  android:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      # The NDK is not optional. `tauri android init` looks for it under ANDROID_NDK_HOME and
      # fails immediately with "Android NDK not found" when it is absent, which is the single
      # most common way this job dies before producing anything.
      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "tauri.cli.androidProjectPath=apps/desktop/src-tauri/gen/android" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-build-deps

      - name: Initialise the Android project
        run: npx --prefix apps/desktop/frontend tauri android init --ci

      # Live capture on Android needs a userspace TCP/IP stack over a VPN slot, which is not
      # implemented. The APK therefore ships the interface listing and offline PCAP analysis,
      # and reports capture as unsupported rather than failing at runtime.
      - name: Build the APK
        run: |
          npx --prefix apps/desktop/frontend tauri android build \
            --config apps/desktop/src-tauri/tauri.conf.json \
            --apk
        env:
          IKLWA_HOME: .sentinel-ci

      # Renamed to the name site/release-manifest.json advertises; see the Linux job.
      - name: Collect the APK
        run: |
          python tools/collect-artifacts.py --platform android --staging artifacts
          ( cd artifacts && sha256sum * > SHA256SUMS.txt )
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-android
          path: artifacts/

  release:
    name: Publish release
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: find artifacts -type f | sort

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            ## Iklwa Sentinel ${{ github.event.inputs.tag || github.ref_name }}

            Local-first network visibility and threat detection. No account, no cloud, no
            telemetry: nothing is sent anywhere.

            | Platform | Artifact | Install |
            | --- | --- | --- |
            | Windows | `.exe` (NSIS), `.msi` | Run the installer. Capture needs an elevated process. |
            | Linux | `.deb`, `.AppImage` | `sudo dpkg -i sentinel_*.deb`, or `chmod +x` the AppImage. |
            | macOS | `.dmg`, `.app` | Unsigned. See the checksum note below. |
            | Android | `.apk` | Sideload with developer mode enabled. Offline analysis only. |

            ### Verifying a download

            Each platform's artifact set includes a `SHA256SUMS.txt`. Compare it against your
            download before running anything:

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            ### Running unsigned macOS builds

            These are not notarised, so Gatekeeper will refuse to open them. Either right-click the
            app and choose Open, or:

            ```
            xattr -d com.apple.quarantine /Applications/Sentinel.app
            ```

            ### Capture permissions

            | Platform | Requirement |
            | --- | --- |
            | Windows | Administrator. Install [Npcap](https://npcap.com/) first. |
            | Linux | `sudo setcap cap_net_raw,cap_net_admin=eip <path to sentinel>` |
            | macOS | Membership of the `access_bpcap` group, or run with `sudo`. |
            | Android | Not implemented. The APK analyses PCAP files only. |

            Offline PCAP analysis needs no privileges on any platform:

            ```
            sentinel analyze capture.pcap
            ```