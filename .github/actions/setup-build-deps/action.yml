name: Set up Sentinel build dependencies
description: >
  Installs the native libraries the workspace links against and builds the frontend
  bundle that compiling the desktop crate requires. Every job in CI and in the release
  matrix needs both, so they live here rather than being copied into six places --
  copied lists drift, and the drift is invisible until a runner fails.

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------- Linux
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update

        # Only the ayatana fork, never both tray libraries: libayatana-appindicator3-1 declares
        # a hard Conflict on libappindicator3-1, so asking for the two -dev packages together is
        # an unsatisfiable request and apt exits 100 having installed nothing.
        sudo apt-get install -y --no-install-recommends \
          libpcap-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          patchelf \
          build-essential \
          curl \
          file

    # --------------------------------------------------------------- Windows
    - name: Install Npcap SDK (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        $work = Join-Path $env:RUNNER_TEMP 'npcap'
        New-Item -ItemType Directory -Force -Path $work | Out-Null

        # Only the SDK, and deliberately no Npcap *runtime*.
        #
        # The SDK provides wpcap.lib, which is what the linker needs. Nothing here installs the
        # driver, and that is the point rather than an omission: Npcap cannot be installed
        # unattended, so every attempt to do it here failed. First `/S` on a made-up version
        # number, then the real 1.89 URL, then a detached launch with a polling deadline, which
        # reached the four-minute timeout because `/S` is not a working silent flag for the free
        # edition. Npcap's own tracker settles it:
        #
        #   "Since the npcap installer has no silent mode, it can not be used to set up npcap
        #    in the CI setup of the rust pcap bindings."  -- nmap/npcap#227
        #
        # The silent installer is an OEM-only feature. A job that needs to *run* test binaries
        # gets a stub DLL from tools/build-stub-wpcap-dll.ps1, which stands in for a machine
        # with no capture driver. A job that only *links* -- which is what every release job
        # does -- needs nothing further.
        $sdk = Join-Path $work 'sdk'
        $archive = Join-Path $work 'sdk.zip'
        Invoke-WebRequest -Uri 'https://npcap.com/dist/npcap-sdk-1.16.zip' -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $sdk

        # Lib\x64 rather than Lib, which also holds the x86 and ARM64 trees: a parent
        # directory on the link path leaves the linker to choose between three import
        # libraries that differ in architecture.
        $lib = Join-Path $sdk 'Lib\x64'
        if (-not (Test-Path (Join-Path $lib 'wpcap.lib'))) {
          throw "wpcap.lib not found under $lib. The SDK layout changed."
        }
        "IKLWA_PCAP_LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # ------------------------------------------------------------- Frontend
    # Built before cargo runs, not after. `tauri::generate_context!` resolves
    # `frontendDist` at compile time and fails when the bundle is absent -- which is
    # exactly what the first macOS run reported.
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: apps/desktop/frontend/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: apps/desktop/frontend
      run: npm ci

    - name: Build the frontend
      shell: bash
      working-directory: apps/desktop/frontend
      run: npm run build